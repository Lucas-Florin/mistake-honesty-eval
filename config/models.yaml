gemini-3.1-pro:
  model: gemini-3.1-pro-preview
  # Not actually dialed by api.py's OpenAI-SDK client (only used there if this model is
  # ever routed through call_chat/call_embeddings); inspect_ai's native `google` provider
  # (used by the chat eval sweep) ignores base_url and reads GOOGLE_API_KEY directly. Kept
  # here so to_inspect_model_id() maps this entry to the "google/" provider prefix.
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GOOGLE_API_KEY
  thinking_format: google

