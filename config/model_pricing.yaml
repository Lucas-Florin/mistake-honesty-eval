# Single source of truth for model pricing ($ per million tokens).
#
# Keyed by inspect-ai model id (`provider/model`, matching `to_inspect_model_id` in
# utils.py / chat_eval.py), NOT the short keys used in `models.yaml`. This file is
# directly consumable by `inspect eval --model-cost-config config/model_pricing.yaml`
# (see inspect_ai.model.ModelCost) and is also read by `CostTracker` for trajectory
# generation cost tracking.
#
# Cache fields are required by inspect's ModelCost; set to 0 where no confirmed
# cache-pricing figure exists. Anthropic cache write/read follow Anthropic's standard
# 1.25x / 0.1x multipliers on the input price; OpenAI cached input is billed at 50% of
# the input price with no separate write cost.

